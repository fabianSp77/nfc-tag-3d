name: Deploy zu GitHub Pages

# Deployt den gebauten Konfigurator auf GitHub Pages.
#
# VORAUSSETZUNG (einmalig, manuell): GitHub Pages muss aktiviert sein
#   Settings → Pages → Source: "GitHub Actions".
# Für PRIVATE Repos benötigt Pages einen bezahlten Plan (Pro/Team). Der
# Actions-Token darf Pages nicht selbst anlegen ("Resource not accessible by
# integration"), deshalb läuft dieser Workflow bewusst NUR manuell, bis Pages
# aktiv ist. Danach kann der Push-Trigger wieder ergänzt werden.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deploys vermeiden; laufendes abbrechen, wenn ein neues kommt.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
